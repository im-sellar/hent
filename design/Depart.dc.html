<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Karla:wght@400;500;700&display=swap">
  <style>
    /* theme:debut */
    :root {
      --fond: #14190f;
      --feuille: #191f13;
      --tuile: #212a19;
      --carte: #1d2418;
      --voile: rgba(20,25,15,.9);
      --trait: #2f3d24;
      --trait-vif: #607a4a;
      --rail: #607a4a;
      --voie: #4d5f3e;
      --grille: #36422c;
      --texte: #e9ead9;
      --texte-doux: #a9b096;
      --texte-gris: #8d9678;
      --accent: #a8c98a;
      --sur-accent: #14190f;
      --accent-vif: #c5e0a8;
      --alerte: #c9a35e;
      --ombre-feuille: 0 -16px 32px rgba(0,0,0,.45);
      --ombre-poignee: 0 2px 8px rgba(0,0,0,.5);
      --trace-fond: rgba(168,201,138,.12);
      --carte-vegetation: #1f2a17;
      --carte-eau: #1a2430;
    }
    /* theme:fin */
    body { margin: 0; font-family: Karla, 'Helvetica Neue', sans-serif; }
    a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: var(--accent-vif); }
    a.btn { text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent-vif); outline-offset: 2px; border-radius: 4px; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; background: var(--fond); color: var(--texte); overflow: hidden;">

  <svg viewBox="0 0 390 844" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-hidden="true">
    <rect width="390" height="844" fill="var(--carte)"/>
    <g stroke="var(--grille)" stroke-width="1" fill="none">
      <path d="M0 120 H390 M0 260 H390 M0 400 H390 M0 540 H390 M0 680 H390"/>
      <path d="M70 0 V844 M160 0 V844 M250 0 V844 M340 0 V844"/>
    </g>
    <g stroke="var(--voie)" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M-10 300 C70 280 120 330 190 310 C260 290 320 340 400 318"/>
      <path d="M40 844 C60 700 30 620 90 540 C140 470 120 400 150 330"/>
      <path d="M300 844 C290 720 330 660 300 580 C270 500 310 440 290 360"/>
      <path d="M-10 470 C80 452 150 486 240 466 C310 450 350 470 400 462"/>
    </g>
  </svg>

  <div style="position: absolute; top: 18px; left: 18px; right: 18px; display: flex; align-items: center; gap: 10px;">
    <a href="#" class="btn" style="display: flex; align-items: center; justify-content: center; min-height: 44px; width: 44px; background: var(--voile); border: 1px solid var(--trait-vif); border-radius: 4px; flex-shrink: 0;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round"><path d="M19 12H6M11 18l-6-6 6-6"/></svg>
    </a>
    <div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; background: var(--voile); border: 1px solid var(--trait-vif); border-radius: 4px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round" style="flex-shrink: 0;"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
      <span style="font-size: 15px; color: var(--texte-gris);">Une adresse, une commune…</span>
    </div>
  </div>

  <div style="position: absolute; top: 396px; left: 50%; transform: translate(-50%, -50%);">
    <svg width="72" height="72" viewBox="0 0 72 72" fill="none" aria-hidden="true">
      <circle cx="36" cy="36" r="21" stroke="var(--fond)" stroke-width="5" opacity=".55"/>
      <circle cx="36" cy="36" r="21" stroke="var(--texte)" stroke-width="2"/>
      <path d="M36 6v13M36 53v13M6 36h13M53 36h13" stroke="var(--fond)" stroke-width="5" opacity=".55" stroke-linecap="round"/>
      <path d="M36 6v13M36 53v13M6 36h13M53 36h13" stroke="var(--texte)" stroke-width="2" stroke-linecap="round"/>
      <circle cx="36" cy="36" r="4.5" fill="var(--accent)" stroke="var(--fond)" stroke-width="2"/>
    </svg>
  </div>

  <button style="position: absolute; right: 18px; bottom: 246px; display: flex; align-items: center; gap: 9px; min-height: 48px; padding: 0 16px; background: var(--voile); color: var(--texte); border: 1px solid var(--trait-vif); border-radius: 4px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="9"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
    Autour de moi
  </button>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--feuille); border-top: 1px solid var(--voie); border-radius: 14px 14px 0 0; box-shadow: var(--ombre-feuille); padding: 12px 20px 26px;">

    <div style="width: 38px; height: 4px; background: var(--rail); border-radius: 2px; margin: 0 auto 20px;"></div>

    <div style="display: flex; flex-direction: column; gap: 18px;">

      <div style="display: flex; align-items: flex-start; gap: 12px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0; margin-top: 3px;">
          <path d="M12 21s7-6.4 7-11a7 7 0 1 0-14 0c0 4.6 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/>
        </svg>
        <div>
          <div style="font-family: Spectral, Georgia, serif; font-size: 19px; line-height: 1.3;">Place du Vert Buisson</div>
          <div style="font-size: 14px; color: var(--texte-gris); margin-top: 2px;">35170 Bruz</div>
        </div>
      </div>

      <div style="font-size: 14px; color: var(--texte-gris);">
        Fais glisser la carte pour ajuster, ou touche un point.
      </div>

      <a href="#" class="btn" style="display: flex; align-items: center; justify-content: center; min-height: 52px; background: var(--accent); color: var(--sur-accent); border-radius: 4px; font-weight: 700; font-size: 17px;">
        Partir d'ici
      </a>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
