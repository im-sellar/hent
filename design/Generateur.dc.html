<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Karla:wght@400;500;700&display=swap">
  <style>
    /* theme:debut */
    :root {
      --fond: #14190f;
      --feuille: #191f13;
      --tuile: #212a19;
      --carte: #1d2418;
      --voile: rgba(20,25,15,.9);
      --trait: #2f3d24;
      --trait-vif: #607a4a;
      --rail: #607a4a;
      --voie: #4d5f3e;
      --grille: #36422c;
      --texte: #e9ead9;
      --texte-doux: #a9b096;
      --texte-gris: #8d9678;
      --accent: #a8c98a;
      --sur-accent: #14190f;
      --accent-vif: #c5e0a8;
      --alerte: #c9a35e;
      --ombre-feuille: 0 -16px 32px rgba(0,0,0,.45);
      --ombre-poignee: 0 2px 8px rgba(0,0,0,.5);
      --trace-fond: rgba(168,201,138,.12);
      --carte-vegetation: #1f2a17;
      --carte-eau: #1a2430;
    }
    /* theme:fin */
    body { margin: 0; font-family: Karla, 'Helvetica Neue', sans-serif; }
    a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
    a:hover { color: var(--accent-vif); }
    a.btn { text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent-vif); outline-offset: 2px; border-radius: 4px; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; background: var(--fond); color: var(--texte); overflow: hidden;">

  <svg viewBox="0 0 390 844" style="position: absolute; inset: 0; width: 100%; height: 100%;" aria-hidden="true">
    <rect width="390" height="844" fill="var(--carte)"/>
    <g stroke="var(--grille)" stroke-width="1" fill="none">
      <path d="M0 120 H390 M0 260 H390 M0 400 H390 M0 540 H390 M0 680 H390"/>
      <path d="M70 0 V844 M160 0 V844 M250 0 V844 M340 0 V844"/>
    </g>
    <g stroke="var(--voie)" stroke-width="2.5" fill="none" stroke-linecap="round">
      <path d="M-10 300 C70 280 120 330 190 310 C260 290 320 340 400 318"/>
      <path d="M40 844 C60 700 30 620 90 540 C140 470 120 400 150 330"/>
      <path d="M300 844 C290 720 330 660 300 580 C270 500 310 440 290 360"/>
    </g>
    <path d="M150 480 C82 430 96 330 172 306 C252 280 330 318 344 382 C358 452 288 520 216 508 C186 502 172 496 150 480 Z"
          fill="var(--trace-fond)" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round"/>
    <circle cx="150" cy="480" r="8" fill="var(--texte)"/>
    <circle cx="150" cy="480" r="8" fill="none" stroke="var(--fond)" stroke-width="2.5"/>
  </svg>

  <div style="position: absolute; top: 18px; left: 18px; right: 18px; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 8px; min-height: 44px; box-sizing: border-box; padding: 9px 14px; background: var(--voile); border: 1px solid var(--trait-vif); border-radius: 4px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round">
        <path d="M12 20c0-4 .5-7.4 0-11.4"/><path d="M12.19 14.2C10 12.6 8.4 11 6.8 8.8"/><path d="M12.21 11.4c1.6-2 3.4-3.8 5.4-5.6"/><path d="M12.09 16.6c1.2-1 2.3-2.1 3.4-3.4"/><circle cx="12" cy="21.4" r="1.9" fill="var(--accent)" stroke="none"/>
      </svg>
      <span style="font-family: Spectral, Georgia, serif; font-size: 15px;">hent</span>
    </div>
    <div style="display: flex; align-items: center; gap: 7px; min-height: 44px; box-sizing: border-box; padding: 9px 13px; background: var(--voile); border: 1px solid var(--trait-vif); border-radius: 4px; font-size: 12px; color: var(--texte-doux);">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      Ille‑et‑Vilaine
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--feuille); border-top: 1px solid var(--voie); border-radius: 14px 14px 0 0; box-shadow: var(--ombre-feuille); padding: 12px 20px 26px;">

    <div style="width: 38px; height: 4px; background: var(--rail); border-radius: 2px; margin: 0 auto 20px;"></div>

    <div style="display: flex; flex-direction: column; gap: 22px;">

      <div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 11px;">
          <span style="font-size: 14px; color: var(--texte-gris); letter-spacing: .04em;">Distance</span>
          <span style="font-family: Spectral, Georgia, serif; font-size: 25px;">18 km</span>
        </div>
        <div style="position: relative; height: 26px;">
          <div style="position: absolute; top: 11px; left: 0; right: 0; height: 4px; background: var(--rail); border-radius: 2px;"></div>
          <div style="position: absolute; top: 11px; left: 0; width: 62%; height: 4px; background: var(--accent-vif); border-radius: 2px;"></div>
          <div style="position: absolute; top: 0; left: calc(62% - 13px); width: 26px; height: 26px; background: var(--texte); border-radius: 50%; box-shadow: var(--ombre-poignee);"></div>
        </div>
      </div>

      <div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 11px;">
          <span style="font-size: 14px; color: var(--texte-gris); letter-spacing: .04em;">Éviter le bitume</span>
          <span style="font-family: Spectral, Georgia, serif; font-size: 25px;">beaucoup</span>
        </div>
        <div style="position: relative; height: 26px;">
          <div style="position: absolute; top: 11px; left: 0; right: 0; height: 4px; background: var(--rail); border-radius: 2px;"></div>
          <div style="position: absolute; top: 11px; left: 0; width: 80%; height: 4px; background: var(--accent-vif); border-radius: 2px;"></div>
          <div style="position: absolute; top: 0; left: calc(80% - 13px); width: 26px; height: 26px; background: var(--texte); border-radius: 50%; box-shadow: var(--ombre-poignee);"></div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 11px;">
        <div style="display: flex; align-items: center; gap: 9px; min-height: 52px; padding: 0 15px; background: var(--tuile); border: 1px solid var(--trait-vif); border-radius: 4px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0;">
            <path d="M12 21s7-6.4 7-11a7 7 0 1 0-14 0c0 4.6 7 11 7 11Z"/><circle cx="12" cy="10" r="2.4"/>
          </svg>
          <span style="font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Bruz, place du Vert Buisson</span>
          <span style="margin-left: auto; font-size: 14px; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; flex-shrink: 0;">changer</span>
        </div>
        <a href="#" class="btn" style="display: flex; align-items: center; justify-content: center; min-height: 52px; background: var(--accent); color: var(--sur-accent); border-radius: 4px; font-weight: 700; font-size: 17px;">
          Tracer ma boucle
        </a>
      </div>

    </div>
  </div>

</div>
</x-dc>
</body>
</html>
